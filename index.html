<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMP - Générateur d'Affiches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Le panneau de contrôle (Formulaire) -->
    <div class="panneau-controle">
        <h2>Générateur OMP</h2>
        
        <label for="input-image">Lien de l'image (ou garder celle par défaut) :</label>
        <input type="text" id="input-image" placeholder="URL de l'image..." value="affiche.jpg">

        <label for="input-nom">Nom du criminel :</label>
        <input type="text" id="input-nom" value="L'OMBRE SKA 2" maxlength="20">

        <label for="input-prime">Montant de la prime :</label>
        <input type="text" id="input-prime" value="1.500" maxlength="10">

        <button id="btn-generer">Générer l'Affiche</button>
        <p class="note">* L'image de fond ne sera pas modifiée, seul le texte s'adapte.</p>
    </div>

    <!-- La zone de l'affiche -->
    <div class="conteneur-affiche" id="affiche">
        <!-- L'image de fond -->
        <img src="affiche.jpg" alt="Affiche Wanted" class="image-fond" id="image-fond">

        <!-- Les textes superposés (Ils sont invisibles au début, puis on les remplit) -->
        <div class="texte-superpose" id="texte-nom">L'OMBRE SKA 2</div>
        <div class="texte-superpose" id="texte-prime">1.500</div>
        
        <!-- Effet lumineux sur le logo OMP -->
        <div class="effet-omp"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
