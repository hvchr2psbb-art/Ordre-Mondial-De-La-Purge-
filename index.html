<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordre Mondial de la Purge - Générateur</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Pirata+One&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        /* --- AMBIANCE DU SITE --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #050000;
            background-image: radial-gradient(circle at 50% 0%, #2a0000 0%, #000000 80%);
            font-family: 'Special Elite', serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ECRAN D'ACCUEIL --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #welcome-screen h1 {
            font-family: 'Pirata One', cursive;
            font-size: 9rem;
            color: #cc0000;
            text-shadow: 0 0 20px #ff0000, 0 0 50px #ff0000;
            margin: 0;
            letter-spacing: 15px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000; }
        }

        .click-hint {
            margin-top: 50px;
            font-size: 1.2rem;
            color: #888;
            animation: blink 1.5s infinite;
            letter-spacing: 4px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- CONTENEUR PRINCIPAL --- */
        #app-container {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* --- PANNEAU DE CONFIGURATION --- */
        .panel {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #333;
            border-left: 4px solid #8a0b0b;
            padding: 25px;
            border-radius: 5px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .panel h2 {
            text-align: center;
            color: #d4af37;
            margin-top: 0;
            font-family: 'Pirata One', cursive;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #000;
            border: 1px solid #444;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: 'Special Elite', serif;
        }

        .form-group input:focus { outline: none; border-color: #cc0000; }

        .file-upload-wrapper { position: relative; overflow: hidden; width: 100%; }
        .file-upload-btn {
            border: 1px dashed #666;
            color: #ccc;
            background-color: #000;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-upload-btn:hover { border-color: #d4af37; color: #d4af37; }
        .file-upload-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }

        #generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #5a0000, #b30000);
            color: #fff;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Special Elite', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: 0.3s;
        }
        #generate-btn:hover { background: linear-gradient(to right, #b30000, #ff0000); }

        /* --- L'AFFICHE (LE DESIGN FINAL) --- */
        #poster-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 2 / 3; /* Format portrait strict */
            background-color: #e8d5b5; /* Couleur parchemin */
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            border: 12px solid #1a100c; /* Bordure noire/bois */
            box-shadow: 0 20px 50px rgba(0,0,0,1), inset 0 0 60px rgba(0,0,0,0.5);
            box-sizing: border-box;
            padding: 4% 5%; /* Espacement interne */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            /* Bords irréguliers */
            clip-path: polygon(1% 0%, 99% 1%, 100% 4%, 99% 98%, 97% 100%, 2% 99%, 0% 96%, 1% 2%);
        }

        /* Titre WANTED */
        .title-wanted {
            font-family: 'Alfa Slab One', cursive;
            font-size: 11vw;
            max-font-size: 3.8rem; /* Ne débordera plus */
            color: #111;
            margin: 0;
            line-height: 0.9;
            text-shadow: 2px 2px 0px #fff, 4px 4px 6px rgba(0,0,0,0.4);
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }

        /* Ligne de séparation */
        .divider-line {
            width: 80%;
            height: 3px;
            background-color: #111;
            margin: 2% 0;
        }

        /* Sous-titre BAN OR SPAM */
        .title-sub {
            font-family: 'Alfa Slab One', cursive;
            font-size: 3.5vw;
            max-font-size: 1.3rem;
            color: #8a0b0b;
            margin: 1% 0;
            letter-spacing: 2px;
            text-align: center;
        }

        /* CADRE DE L'IMAGE (Parfaitement proportionné) */
        .photo-frame {
            width: 85%;
            height: 35%; /* Prend 35% de la hauteur totale */
            background-color: #000;
            border: 4px solid #111;
            margin: 3% 0;
            box-shadow: inset 0 0 20px #000, 0 5px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #poster-photo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* L'image remplit le cadre sans se déformer */
            display: none;
        }

        .photo-placeholder {
            color: #555;
            font-size: 1rem;
            text-align: center;
            font-family: 'Special Elite', serif;
        }

        /* Nom */
        .poster-name {
            font-family: 'Alfa Slab One', cursive;
            font-size: 4.5vw;
            max-font-size: 1.8rem;
            color: #111;
            text-transform: uppercase;
            text-align: center;
            margin: 1% 0;
            width: 95%;
            line-height: 1;
            word-wrap: break-word;
        }

        /* Prime */
        .poster-prime {
            font-family: 'Alfa Slab One', cursive;
            font-size: 6vw;
            max-font-size: 2.2rem;
            color: #8a0b0b;
            margin: 2% 0;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        /* Footer (Texte modifié selon ta demande) */
        .omp-footer {
            text-align: center;
            width: 100%;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .omp-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 3vw;
            max-font-size: 1.1rem;
            color: #111;
            margin-bottom: 2%;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .omp-text {
            font-family: 'Special Elite', serif;
            font-size: 2.2vw;
            max-font-size: 0.75rem;
            color: #333;
            line-height: 1.2;
            margin: 0;
            text-align: center;
        }

        /* Bouton Télécharger */
        #download-btn {
            display: none;
            padding: 15px 30px;
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Special Elite', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            transition: 0.3s;
        }
        #download-btn:hover { background: #d4af37; color: #000; }

        /* Ajustements pour les petits écrans */
        @media (max-width: 500px) {
            .title-wanted { font-size: 14vw; }
            .title-sub { font-size: 4vw; }
            .poster-name { font-size: 6vw; }
            .poster-prime { font-size: 7vw; }
            .omp-title { font-size: 3.5vw; }
            .omp-text { font-size: 2.5vw; }
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="welcome-screen">
        <h1>O.M.P</h1>
        <div class="click-hint">[ Cliquez pour entrer ]</div>
    </div>

    <!-- APPLICATION -->
    <div id="app-container">
        
        <!-- Formulaire -->
        <div class="panel">
            <h2>Créer une Prime</h2>
            
            <div class="form-group">
                <label>Nom du criminel :</label>
                <input type="text" id="input-name" value="MUICHIRO ALASTOR ZR">
            </div>

            <div class="form-group">
                <label>Photo du criminel :</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-btn" id="file-label">📸 Choisir une photo</div>
                    <input type="file" id="input-photo" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label>Montant de la prime :</label>
                <input type="number" id="input-prime" value="1500">
            </div>

            <button id="generate-btn">Mettre à jour l'affiche</button>
        </div>

        <!-- L'AFFICHE -->
        <div id="poster-container">
            <div class="title-wanted">WANTED</div>
            
            <div class="divider-line"></div>
            <div class="title-sub">BAN OR SPAM</div>
            <div class="divider-line"></div>
            
            <div class="photo-frame">
                <img id="poster-photo" src="" alt="Photo">
                <div class="photo-placeholder" id="photo-placeholder">[ PHOTO ]</div>
            </div>
            
            <div class="poster-name" id="poster-name">MUICHIRO ALASTOR ZR</div>
            <div class="poster-prime">PRIME : <span id="poster-prime-val">1 500</span></div>
            
            <div class="omp-footer">
                <div class="omp-title">ORDRE MONDIAL DE LA PURGE</div>
                <p class="omp-text">
                    Cette prime a été attribuée par l'Ordre Mondial.<br>
                    Toute modification ou falsification de cette dernière<br>
                    sera sévèrement punie.
                </p>
            </div>
        </div>

        <button id="download-btn">📥 Télécharger l'image</button>
    </div>

    <!-- MUSIQUE -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. ACCUEIL ET MUSIQUE
        const welcomeScreen = document.getElementById('welcome-screen');
        const appContainer = document.getElementById('app-container');
        const music = document.getElementById('bg-music');

        welcomeScreen.addEventListener('click', () => {
            music.volume = 0.3;
            music.play().catch(e => console.log("Audio bloqué"));
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                setTimeout(() => appContainer.style.opacity = '1', 50);
            }, 800);
        });

        // 2. UPLOAD D'IMAGE
        const fileInput = document.getElementById('input-photo');
        const fileLabel = document.getElementById('file-label');
        const posterPhoto = document.getElementById('poster-photo');
        const photoPlaceholder = document.getElementById('photo-placeholder');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileLabel.textContent = "✅ Image chargée";
                fileLabel.style.borderColor = "#4caf50";
                fileLabel.style.color = "#4caf50";

                const reader = new FileReader();
                reader.onload = function(event) {
                    posterPhoto.src = event.target.result;
                    posterPhoto.style.display = 'block';
                    photoPlaceholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. MISE A JOUR DU TEXTE
        const genBtn = document.getElementById('generate-btn');
        const posterName = document.getElementById('poster-name');
        const posterPrimeVal = document.getElementById('poster-prime-val');

        genBtn.addEventListener('click', () => {
            const nameValue = document.getElementById('input-name').value;
            const primeValue = document.getElementById('input-prime').value;

            posterName.textContent = nameValue || "INCONNU";
            posterPrimeVal.textContent = Number(primeValue).toLocaleString('fr-FR') || "0";
            
            // Effet visuel
            const poster = document.getElementById('poster-container');
            poster.style.transform = "scale(0.97)";
            setTimeout(() => poster.style.transform = "scale(1)", 150);
        });

        // 4. TELECHARGEMENT
        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.style.display = 'block';

        downloadBtn.addEventListener('click', () => {
            downloadBtn.style.display = 'none'; // Cache le bouton
            
            html2canvas(document.getElementById('poster-container'), {
                scale: 2, // Haute qualité
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Affiche_Prime.png';
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                downloadBtn.style.display = 'block';
            }).catch(err => {
                alert("Erreur de téléchargement. Fais une capture d'écran de l'affiche à la place !");
                downloadBtn.style.display = 'block';
            });
        });
    </script>
</body>
</html>
